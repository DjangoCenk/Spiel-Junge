<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>İsim Seçme Oyunu</title>
<style>
  :root {
    --bg1: #e8f2ff;
    --bg2: #f8fbff;
    --card: #ffffff;
    --ink: #0b2545;
    --muted: #5d7391;
    --accent: #1c7ed6;
    --accent-dark: #1864ab;
    --accent-soft: #e3f0ff;
    --gold: #f6b93b;
    --gold-soft: #fff4d6;
    --good: #2b8a3e;
    --bad: #c92a2a;
    --line: #d5e4f7;
    --shadow: 0 12px 32px rgba(18, 70, 130, .13);
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; min-height: 100%; }
  body {
    background:
      radial-gradient(900px 420px at 85% -5%, #d0e6ff 0%, transparent 60%),
      radial-gradient(700px 380px at 5% 105%, #dcedff 0%, transparent 60%),
      linear-gradient(180deg, var(--bg1), var(--bg2));
    background-attachment: fixed;
    color: var(--ink);
    font-family: "Segoe UI", system-ui, -apple-system, Roboto, sans-serif;
    display: flex; justify-content: center; padding: 18px 14px 60px;
  }
  #app { width: 100%; max-width: 820px; }

  /* Üst başlık */
  .banner {
    position: relative; overflow: hidden; text-align: center; color: #fff;
    background: linear-gradient(135deg, #123b6d 0%, #1c7ed6 100%);
    border-radius: 24px; padding: 22px 20px 20px; margin-bottom: 20px;
    box-shadow: var(--shadow);
  }
  .banner::before, .banner::after { content: "✦"; position: absolute; color: rgba(255,255,255,.28); font-size: 1.6rem; }
  .banner::before { left: 22px; top: 54px; }
  .banner::after { right: 26px; bottom: 18px; font-size: 1.1rem; }
  .banner .moon { position: absolute; left: 18px; top: 12px; font-size: 1.5rem; opacity: .9; }
  .banner h1 { margin: 0; font-size: .85rem; letter-spacing: .14em; text-transform: uppercase; font-weight: 600; opacity: .85; }
  .banner .family { font-size: clamp(1.5rem, 5vw, 2.1rem); font-weight: 800; margin: 6px 0 2px; }
  .banner .for { font-size: .95rem; opacity: .9; }
  .langs { position: absolute; right: 14px; top: 12px; display: flex; gap: 6px; }
  .langs button { background: rgba(255,255,255,.16); color: #fff; font-weight: 700; font-size: .78rem; padding: 5px 10px; border-radius: 99px; border: 1px solid rgba(255,255,255,.35); letter-spacing: .05em; }
  .langs button.on { background: #fff; color: var(--accent-dark); }

  .screen { display: none; animation: fade .35s ease; }
  .screen.active { display: block; }
  @keyframes fade { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: none; } }

  .panel { background: var(--card); border-radius: 22px; box-shadow: var(--shadow); padding: 28px; border: 1px solid var(--line); }
  .panel + .panel { margin-top: 18px; }
  .hero { text-align: center; }
  .hero .big { font-size: clamp(1.6rem, 5vw, 2.1rem); font-weight: 800; line-height: 1.2; margin: 2px 0 10px; }
  .hero p { color: var(--muted); margin: 0 auto 22px; max-width: 560px; line-height: 1.55; }
  .row { display: flex; gap: 14px; flex-wrap: wrap; justify-content: center; margin-bottom: 22px; }
  label.field { display: flex; flex-direction: column; gap: 6px; text-align: left; font-size: .85rem; color: var(--muted); font-weight: 600; max-width: 260px; }
  select { font: inherit; font-size: 1rem; padding: 10px 12px; border-radius: 12px; border: 1.5px solid var(--line); background: #f8fbff; color: var(--ink); min-width: 210px; }

  button { font: inherit; cursor: pointer; border: 0; }
  .btn { background: var(--accent); color: #fff; font-weight: 700; padding: 14px 28px; border-radius: 14px; font-size: 1.05rem; transition: transform .12s ease, filter .12s ease; box-shadow: 0 6px 16px rgba(28,126,214,.28); }
  .btn:hover { filter: brightness(1.07); transform: translateY(-1px); }
  .btn:disabled { opacity: .45; cursor: not-allowed; transform: none; box-shadow: none; }
  .btn.ghost { background: var(--accent-soft); color: var(--accent-dark); box-shadow: none; }

  .topline { display: flex; justify-content: space-between; align-items: center; color: var(--muted); font-size: .9rem; margin-bottom: 12px; font-weight: 600; }
  .bar { height: 8px; background: var(--accent-soft); border-radius: 99px; overflow: hidden; margin-bottom: 18px; }
  .bar > i { display: block; height: 100%; width: 0; background: linear-gradient(90deg, #4dabf7, var(--accent)); transition: width .3s ease; }

  .name-card { text-align: center; padding: 32px 22px 28px; min-height: 260px; display: flex; flex-direction: column; justify-content: center; }
  .full { font-weight: 800; letter-spacing: .01em; }
  .full .last { color: var(--muted); font-weight: 700; }
  .name-card .full { font-size: clamp(2.2rem, 8vw, 3.6rem); margin-bottom: 14px; }
  .name-card .full .first { color: var(--accent-dark); }
  .mcap { display: none; font-size: .72rem; letter-spacing: .1em; text-transform: uppercase; color: var(--accent); font-weight: 700; margin-bottom: 4px; }
  body[data-lang="de"] .mcap { display: block; }
  .meaning { color: var(--muted); line-height: 1.55; font-size: 1.05rem; max-width: 560px; margin: 0 auto; }
  .name-card.swipe-yes { animation: yes .28s ease; }
  .name-card.swipe-no { animation: no .28s ease; }
  @keyframes yes { to { transform: translateX(60px) rotate(4deg); opacity: 0; } }
  @keyframes no { to { transform: translateX(-60px) rotate(-4deg); opacity: 0; } }

  .actions { display: flex; gap: 14px; justify-content: center; margin-top: 20px; }
  .actions .btn { min-width: 160px; }
  .btn.no { background: #fff; color: var(--bad); border: 2px solid #f3c9c9; box-shadow: none; }
  .btn.yes { background: var(--good); box-shadow: 0 6px 16px rgba(43,138,62,.25); }
  .hint { text-align: center; color: var(--muted); font-size: .85rem; margin-top: 14px; }
  .hint.warn { color: var(--bad); font-weight: 600; }

  .duel { display: grid; grid-template-columns: 1fr 1fr; gap: 18px; }
  .pick { background: var(--card); border: 2px solid var(--line); border-radius: 20px; padding: 28px 18px; text-align: center; box-shadow: var(--shadow); transition: transform .15s ease, border-color .15s ease; color: var(--ink); }
  .pick:hover, .pick:active { transform: translateY(-4px); border-color: var(--accent); }
  .pick .full { font-size: clamp(1.8rem, 6vw, 2.6rem); margin-bottom: 10px; }
  .pick .full .first { color: var(--accent-dark); }
  .pick .meaning { font-size: .98rem; }
  .vs { text-align: center; color: var(--muted); margin-top: 16px; font-size: .9rem; }

  /* İlerleme panelleri */
  .sec-title { font-size: 1.1rem; font-weight: 800; margin: 0 0 4px; }
  .sec-sub { color: var(--muted); font-size: .9rem; line-height: 1.5; margin: 0 0 14px; }
  .lgrid { display: grid; grid-template-columns: repeat(auto-fill, minmax(84px, 1fr)); gap: 8px; }
  .lchip { background: #f4f8fe; border: 1.5px solid var(--line); border-radius: 12px; padding: 8px 6px 6px; text-align: center; color: var(--muted); font-weight: 800; font-size: 1.15rem; min-height: 58px; }
  .lchip small { display: block; font-size: .7rem; font-weight: 600; margin-top: 2px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; min-height: 1em; }
  .lchip.done { background: var(--accent-soft); color: var(--accent-dark); border-color: var(--accent); }
  .lchip.skip { border-style: dashed; }
  .lchip.sel { outline: 3px solid var(--gold); outline-offset: 1px; }
  .chips { display: flex; flex-wrap: wrap; gap: 8px; }
  .chip { background: var(--accent-soft); color: var(--accent-dark); padding: 6px 12px; border-radius: 99px; font-weight: 700; font-size: .92rem; }
  .linkbtn { background: none; color: var(--muted); font-size: .85rem; text-decoration: underline; padding: 8px 4px; }
  .resume { border: 2px solid var(--gold); background: var(--gold-soft); text-align: center; }
  .best { border: 2px solid var(--gold); background: linear-gradient(180deg, #fffdf6, #fff); }
  .best.locked { border-color: var(--line); background: var(--card); }
  .best .lock { font-size: 1.6rem; margin-right: 6px; }
  .best .btn { margin-top: 6px; }
  .bestprev { color: var(--accent-dark); font-weight: 700; margin-top: 10px; font-size: .92rem; }

  @media (max-width: 620px) {
    .duel { grid-template-columns: 1fr; }
    .actions .btn { min-width: 0; flex: 1; padding: 14px 12px; }
    .panel { padding: 22px 18px; }
    .langs { top: 10px; right: 10px; }
  }

  .result { text-align: center; position: relative; overflow: hidden; }
  .result .crown { font-size: 3rem; }
  .result .label { color: var(--muted); font-weight: 600; letter-spacing: .08em; text-transform: uppercase; font-size: .85rem; }
  .result .winner { margin: 8px 0 6px; line-height: 1.05; }
  .result .winner .first { display: block; font-size: clamp(3rem, 13vw, 5.4rem); font-weight: 900; color: var(--accent); }
  .result .winner .last { display: block; font-size: clamp(1.6rem, 6vw, 2.4rem); font-weight: 800; color: var(--ink); }
  .result .family-line { color: var(--accent-dark); background: var(--accent-soft); display: inline-block; padding: 6px 16px; border-radius: 99px; font-weight: 700; font-size: .92rem; margin: 10px 0 16px; }
  .result .meaning { color: var(--ink); max-width: 560px; margin: 0 auto 18px; font-size: 1.08rem; }
  .result .saved { background: var(--gold-soft); color: #7a5a00; border-radius: 12px; padding: 10px 14px; max-width: 560px; margin: 0 auto 18px; font-size: .92rem; font-weight: 600; }
  .result .second { color: var(--muted); margin-bottom: 22px; }
  .liked-list { margin: 8px auto 20px; max-width: 560px; display: none; flex-wrap: wrap; gap: 8px; justify-content: center; }
  .liked-list.show { display: flex; }
  .baby { display: flex; align-items: flex-end; gap: 12px; max-width: 560px; margin: 4px auto 22px; text-align: left; animation: pop .6s .5s ease both; }
  .baby .avatar { flex: none; width: 54px; height: 54px; border-radius: 50%; background: #fff3d6; border: 2px solid #ffe3a3; display: flex; align-items: center; justify-content: center; font-size: 1.9rem; }
  .baby .bubble { position: relative; background: var(--accent-soft); color: var(--ink); border-radius: 20px 20px 20px 6px; padding: 14px 18px; line-height: 1.55; font-size: 1.02rem; border: 1px solid var(--line); }
  @keyframes pop { from { opacity: 0; transform: translateY(14px) scale(.96); } to { opacity: 1; transform: none; } }
  .confetti { position: absolute; top: -20px; font-size: 1.4rem; animation: fall linear forwards; pointer-events: none; }
  @keyframes fall { to { transform: translateY(640px) rotate(360deg); opacity: .2; } }
</style>
</head>
<body data-lang="tr">
<noscript><div style="background:#fff3cd;color:#664d03;padding:14px 16px;text-align:center;font-family:sans-serif;line-height:1.5">Bu oyun JavaScript gerektirir. Dosya bir önizlemede açıldıysa lütfen Safari ya da Chrome ile açın veya bağlantı (link) kullanın.<br>Dieses Spiel benötigt JavaScript. Bitte im Browser (Safari/Chrome) öffnen oder den Link verwenden.</div></noscript>
<div id="app">
  <header class="banner">
    <span class="moon">🌙</span>
    <div class="langs">
      <button type="button" data-l="tr">TR</button>
      <button type="button" data-l="de">DE</button>
    </div>
    <h1 data-i18n="h1">İsim Seçme Oyunu</h1>
    <div class="family">Cenk &amp; Çağla Kaya</div>
    <div class="for" data-i18n="forWho"></div>
  </header>

  <!-- 1. Başlangıç -->
  <section id="s-start" class="screen active">
    <div class="panel resume" id="resumePanel" style="display:none">
      <h2 class="sec-title" data-i18n="resumeTitle"></h2>
      <p class="sec-sub" id="resumeText"></p>
      <button class="btn" id="resumeBtn" data-i18n="resumeBtn"></button>
      <button type="button" class="linkbtn" id="resumeDrop" data-i18n="resumeDrop"></button>
    </div>
    <div class="panel hero">
      <div class="big" data-i18n="heroTitle"></div>
      <p data-i18n="heroText"></p>
      <div class="row">
        <label class="field"><span data-i18n="letterLabel"></span>
          <select id="letter"></select>
        </label>
        <label class="field"><span data-i18n="targetLabel"></span>
          <select id="target">
            <option value="8" data-i18n="t8"></option>
            <option value="16" data-i18n="t16" selected></option>
            <option value="32" data-i18n="t32"></option>
          </select>
        </label>
      </div>
      <button class="btn" id="start" data-i18n="startBtn"></button>
      <div class="hint" id="count"></div>
      <div class="hint" data-i18n="note"></div>
    </div>

    <div class="panel" id="progPanel">
      <h2 class="sec-title" data-i18n="progTitle"></h2>
      <p class="sec-sub"><span id="progCount"></span> · <span data-i18n="progHint"></span></p>
      <div class="lgrid" id="letterGrid"></div>
      <div style="text-align:center; margin-top:10px">
        <button type="button" class="linkbtn" id="reset" data-i18n="resetBtn"></button>
      </div>
      <div class="hint warn" id="storeHint"></div>
    </div>

    <div class="panel" id="extraPanel" style="display:none">
      <h2 class="sec-title" data-i18n="extraTitle"></h2>
      <p class="sec-sub" data-i18n="extraHint"></p>
      <div class="chips" id="extraList"></div>
    </div>

    <div class="panel best locked" id="bestPanel">
      <h2 class="sec-title"><span class="lock" id="bestLock">🔒</span><span data-i18n="bestTitle"></span></h2>
      <p class="sec-sub" id="bestText"></p>
      <button class="btn" id="bestStart" data-i18n="bestStart" disabled></button>
      <div class="bestprev" id="bestPrev"></div>
    </div>
  </section>

  <!-- 2. İsim toplama -->
  <section id="s-swipe" class="screen">
    <div class="topline"><span id="likedCount"></span><span id="seenCount"></span></div>
    <div class="bar"><i id="likeBar"></i></div>
    <div class="panel name-card" id="card">
      <div class="full" id="cName"></div>
      <div class="mcap" data-i18n="meaningCap"></div>
      <div class="meaning" id="cMeaning"></div>
    </div>
    <div class="actions">
      <button class="btn no" id="no" data-i18n="no"></button>
      <button class="btn yes" id="yes" data-i18n="yes"></button>
    </div>
    <div class="actions" style="margin-top:12px">
      <button class="btn ghost" id="enough" data-i18n="enough" disabled></button>
    </div>
    <div class="hint" data-i18n="hint"></div>
  </section>

  <!-- 3. Eşleşmeler -->
  <section id="s-duel" class="screen">
    <div class="topline"><span id="roundName"></span><span id="matchNo"></span></div>
    <div class="bar"><i id="duelBar"></i></div>
    <div class="duel">
      <button class="pick" id="pickA"><div class="full"></div><div class="mcap" data-i18n="meaningCap"></div><div class="meaning"></div></button>
      <button class="pick" id="pickB"><div class="full"></div><div class="mcap" data-i18n="meaningCap"></div><div class="meaning"></div></button>
    </div>
    <div class="vs" data-i18n="vs"></div>
  </section>

  <!-- 4. Sonuç -->
  <section id="s-result" class="screen">
    <div class="panel result" id="resultPanel">
      <div class="crown">👑</div>
      <div class="label" id="resultLabelEl"></div>
      <div class="winner" id="winner"></div>
      <div class="family-line" data-i18n="resultFamily"></div>
      <div class="mcap" data-i18n="meaningCap"></div>
      <div class="meaning" id="winMeaning"></div>
      <div class="saved" id="savedNote"></div>
      <div class="baby" id="baby">
        <div class="avatar">👶</div>
        <div class="bubble" id="babyText"></div>
      </div>
      <div class="second" id="second"></div>
      <div class="liked-list" id="likedList"></div>
      <div class="row" style="margin-bottom:0">
        <button class="btn ghost" id="showLiked"></button>
        <button class="btn" id="again" data-i18n="again"></button>
      </div>
    </div>
  </section>
</div>

<script>

function t(key, vars) {
  let s = (I18N[lang] && I18N[lang][key] !== undefined) ? I18N[lang][key] : key;
  if (vars) for (const k in vars) s = s.split('{' + k + '}').join(vars[k]);
  return s;
}

const isActive = n => $('s-' + n).classList.contains('active');
function show(name) {
  screens.forEach(s => $('s-' + s).classList.toggle('active', s === name));
  window.scrollTo(0, 0);
}
function shuffle(a) {
  a = a.slice();
  for (let i = a.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [a[i], a[j]] = [a[j], a[i]];
  }
  return a;
}

// Ad + soyad gösterimi (soyad hep "Kaya")
function setFull(el, name, block) {
  el.innerHTML = '';
  const f = document.createElement('span');
  f.className = 'first'; f.textContent = name;
  const l = document.createElement('span');
  l.className = 'last'; l.textContent = block ? SURNAME : ' ' + SURNAME;
  el.appendChild(f); el.appendChild(l);
}
function chip(el, text) {
  const s = document.createElement('span');
  s.className = 'chip'; s.textContent = text;
  el.appendChild(s);
}

// ---------- Kayıtlı ilerleme ----------
// letters: { "A": "Aybars" (birinci) | null (isim seçilmeden geçildi) }
// extras : "Tüm isimler" oyunlarının birincileri (harf oyunlarına sayılmaz)
const STORE_KEY = 'isim-oyunu-ilerleme-v1';
let progress = { letters: {}, extras: [], best: null };
let storageOK = true;
try {
  localStorage.setItem(STORE_KEY + '-test', '1');
  localStorage.removeItem(STORE_KEY + '-test');
  const raw = localStorage.getItem(STORE_KEY);
  if (raw) {
    const p = JSON.parse(raw);
    if (p && typeof p === 'object') {
      progress.letters = (p.letters && typeof p.letters === 'object') ? p.letters : {};
      progress.extras = Array.isArray(p.extras) ? p.extras : [];
      progress.best = p.best || null;
    }
  }
} catch (e) { storageOK = false; }
function saveProgress() {
  try { localStorage.setItem(STORE_KEY, JSON.stringify(progress)); } catch (e) { storageOK = false; }
}

// Yarım kalan oyun (kapatılıp açılınca devam edilebilsin)
const SESSION_KEY = 'isim-oyunu-oturum-v1';
function clearSession() { try { localStorage.removeItem(SESSION_KEY); } catch (e) {} }
function readSession() {
  try { const r = localStorage.getItem(SESSION_KEY); return r ? JSON.parse(r) : null; } catch (e) { return null; }
}
function saveSession() {
  try {
    const nm = a => a.map(x => x[0]);
    localStorage.setItem(SESSION_KEY, JSON.stringify({
      mode, curLetter, replay, target, idx,
      phase: isActive('duel') ? 'duel' : 'swipe',
      pool: nm(pool), liked: nm(liked), current: nm(current), nextRound: nm(nextRound),
      pos, runnerUp: runnerUp ? runnerUp[0] : null, totalMatches, doneMatches
    }));
  } catch (e) {}
}
function sessionWhat(s) {
  return s.mode === 'letter' ? t('whatLetter', { l: s.curLetter }) : s.mode === 'best' ? t('whatBest') : t('whatAll');
}

// ---------- Oyun durumu ----------
let replay = false;
let mode = 'all';          // 'all' | 'letter' | 'best'
let curLetter = '';
let pool = [], idx = 0, liked = [], target = 16, busy = false;
let current = [], nextRound = [], pos = 0, runnerUp = null, totalMatches = 0, doneMatches = 0;
let winnerName = '', babyIdx = 0;

// ---------- Başlangıç ekranı ----------
const letters = [...new Set(NAMES.map(n => n[0][0]))].sort((a, b) => a.localeCompare(b, 'tr'));
const letterSel = $('letter');
const isDone = l => Object.prototype.hasOwnProperty.call(progress.letters, l);

function rebuildLetters() {
  const keep = letterSel.value;
  letterSel.innerHTML = '';
  const all = document.createElement('option');
  all.value = ''; all.textContent = t('all');
  letterSel.appendChild(all);
  letters.forEach(l => {
    const o = document.createElement('option');
    o.value = l; o.textContent = l + (isDone(l) ? '  ✓' : '');
    letterSel.appendChild(o);
  });
  letterSel.value = keep;
}
function updateCount() {
  const l = letterSel.value;
  const n = l ? NAMES.filter(x => x[0][0] === l).length : NAMES.length;
  $('count').textContent = t('count', { n });
}
letterSel.addEventListener('change', () => { updateCount(); renderProgress(); });

function bestPool() {
  const names = [];
  letters.forEach(l => { const w = progress.letters[l]; if (w) names.push(w); });
  progress.extras.forEach(n => names.push(n));
  return [...new Set(names)].map(n => BYNAME.get(n)).filter(Boolean);
}

function renderProgress() {
  rebuildLetters();
  updateCount();
  const doneN = letters.filter(isDone).length;
  const allDone = doneN === letters.length;
  $('progCount').textContent = t('progCount', { a: doneN, b: letters.length });

  const grid = $('letterGrid');
  grid.innerHTML = '';
  letters.forEach(l => {
    const b = document.createElement('button');
    b.type = 'button';
    const done = isDone(l);
    b.className = 'lchip' + (done ? (progress.letters[l] ? ' done' : ' skip') : '') + (letterSel.value === l ? ' sel' : '');
    const big = document.createElement('span'); big.textContent = l;
    const sm = document.createElement('small'); sm.textContent = done ? (progress.letters[l] || '—') : '';
    b.appendChild(big); b.appendChild(sm);
    b.onclick = () => { letterSel.value = l; renderProgress(); };
    grid.appendChild(b);
  });

  const ex = progress.extras.filter(n => BYNAME.has(n));
  $('extraPanel').style.display = ex.length ? 'block' : 'none';
  const exList = $('extraList');
  exList.innerHTML = '';
  ex.forEach(n => chip(exList, n + ' ' + SURNAME));

  const bp = bestPool();
  const ready = allDone && bp.length >= 2;
  $('bestText').textContent = !allDone ? t('bestLocked') : (bp.length >= 2 ? t('bestReady') : t('bestNeed'));
  $('bestStart').disabled = !ready;
  $('bestPanel').classList.toggle('locked', !ready);
  $('bestLock').textContent = ready ? '🏆' : '🔒';
  $('bestPrev').textContent = progress.best ? t('bestPrev', { n: progress.best + ' ' + SURNAME }) : '';

  const ss = readSession();
  $('resumePanel').style.display = ss ? 'block' : 'none';
  if (ss) $('resumeText').textContent = t('resumeText', { what: sessionWhat(ss) });

  $('reset').style.display = (doneN > 0 || ex.length > 0 || progress.best) ? 'inline' : 'none';
  $('storeHint').textContent = storageOK ? '' : t('storeBad');
}

function goStart() {
  clearSession();
  show('start');
  renderProgress();
}

$('resumeDrop').onclick = () => { clearSession(); renderProgress(); };
$('resumeBtn').onclick = () => {
  const s = readSession();
  if (!s) return;
  const get = a => (a || []).map(n => BYNAME.get(n)).filter(Boolean);
  mode = s.mode || 'all'; curLetter = s.curLetter || ''; replay = !!s.replay;
  target = s.target || 16;
  pool = get(s.pool); liked = get(s.liked); idx = Math.min(s.idx || 0, pool.length);
  busy = false;
  if (s.phase === 'duel') {
    current = get(s.current); nextRound = get(s.nextRound); pos = s.pos || 0;
    runnerUp = s.runnerUp ? (BYNAME.get(s.runnerUp) || null) : null;
    totalMatches = s.totalMatches || Math.max(1, current.length - 1);
    doneMatches = s.doneMatches || 0;
    if (current.length + nextRound.length < 2) { clearSession(); renderProgress(); return; }
    show('duel');
    nextMatch();
  } else {
    show('swipe');
    showCard();
  }
};

$('reset').onclick = () => {
  if (!confirm(t('resetConfirm'))) return;
  progress = { letters: {}, extras: [], best: null };
  saveProgress();
  renderProgress();
};

// ---------- Etiketler (dil değişince yenilenir) ----------
function updateSwipeLabels() {
  $('likedCount').textContent = t('liked', { a: liked.length, b: target });
  $('seenCount').textContent = t('seen', { n: idx + 1 });
}
function roundTitle(n) {
  if (n === 2) return t('final');
  if (n === 3 || n === 4) return t('semi');
  if (n <= 8) return t('quarter');
  return t('left', { n });
}
function updateDuelLabels() {
  if (!current.length) return;
  $('roundName').textContent = roundTitle(current.length);
  $('matchNo').textContent = t('match', { a: Math.floor(pos / 2) + 1, b: Math.floor(current.length / 2) });
}
function updateResultLabels() {
  const msgs = I18N[lang].babyMsgs;
  $('babyText').textContent = msgs[babyIdx % msgs.length].split('{n}').join(winnerName);
  $('resultLabelEl').textContent =
    mode === 'letter' ? t('letterWinnerLabel', { l: curLetter }) :
    mode === 'best' ? t('bestWinnerLabel') : t('allWinnerLabel');

  let note = '';
  if (mode === 'letter' && replay) {
    note = t('savedReplay', { l: curLetter, n: progress.letters[curLetter] });
  } else if (mode === 'letter') {
    note = t('savedLetter', { l: curLetter });
    const allDone = letters.every(isDone);
    if (allDone && bestPool().length >= 2) note += ' ' + t('allDoneNote');
  } else if (mode === 'all') {
    note = t('savedExtra');
  }
  $('savedNote').textContent = note;
  $('savedNote').style.display = note ? 'block' : 'none';

  $('second').textContent = runnerUp ? t('second', { n: runnerUp[0] + ' ' + SURNAME }) : '';
  const open = $('likedList').classList.contains('show');
  $('showLiked').textContent = mode === 'best'
    ? (open ? t('hideFinal') : t('showFinal'))
    : (open ? t('hideLiked') : t('showLiked'));
}
function applyLang() {
  document.documentElement.lang = lang;
  document.body.setAttribute('data-lang', lang);
  document.title = t('h1');
  document.querySelectorAll('[data-i18n]').forEach(e => { e.textContent = t(e.getAttribute('data-i18n')); });
  document.querySelectorAll('.langs button').forEach(b => b.classList.toggle('on', b.getAttribute('data-l') === lang));
  renderProgress();
  if (isActive('swipe')) updateSwipeLabels();
  if (isActive('duel')) updateDuelLabels();
  if (isActive('result')) updateResultLabels();
}
document.querySelectorAll('.langs button').forEach(b => {
  b.addEventListener('click', () => {
    lang = b.getAttribute('data-l');
    try { localStorage.setItem('isim-oyunu-dil', lang); } catch (e) {}
    applyLang();
  });
});

// ---------- İsim toplama ----------
$('start').onclick = () => {
  const l = letterSel.value;
  mode = l ? 'letter' : 'all';
  curLetter = l;
  replay = !!(l && progress.letters[l]);   // tamamlanmış harf tekrar oynanıyor
  pool = shuffle(l ? NAMES.filter(x => x[0][0] === l) : NAMES);
  target = parseInt($('target').value, 10);
  idx = 0; liked = []; busy = false;
  show('swipe');
  showCard();
};

function showCard() {
  if (idx >= pool.length) {
    // isimler bitti
    if (liked.length >= 2) return startDuels(liked);
    if (liked.length === 1) return finish(liked[0]);
    if (mode === 'letter' && replay) {
      alert(t('noneReplay', { l: curLetter, n: progress.letters[curLetter] }));
    } else if (mode === 'letter') {
      progress.letters[curLetter] = null;
      saveProgress();
      alert(t('noneLetter', { l: curLetter }));
    } else {
      alert(t('noneAlert'));
    }
    return goStart();
  }
  const [n, m] = pool[idx];
  setFull($('cName'), n);
  $('cMeaning').textContent = m;
  $('card').className = 'panel name-card';
  updateSwipeLabels();
  $('likeBar').style.width = (liked.length / target * 100) + '%';
  $('enough').disabled = liked.length < 4;
  busy = false;
  saveSession();
}

function answer(yes) {
  if (busy || !isActive('swipe')) return;
  busy = true;
  if (yes) liked.push(pool[idx]);
  $('card').classList.add(yes ? 'swipe-yes' : 'swipe-no');
  idx++;
  setTimeout(() => {
    if (liked.length >= target) startDuels(liked);
    else showCard();
  }, 230);
}
$('yes').onclick = () => answer(true);
$('no').onclick = () => answer(false);
$('enough').onclick = () => { if (liked.length >= 4) startDuels(liked); };
document.addEventListener('keydown', e => {
  if (e.key === 'ArrowRight') answer(true);
  if (e.key === 'ArrowLeft') answer(false);
});

// ---------- En iyiler ----------
$('bestStart').onclick = () => {
  const items = bestPool();
  if (items.length < 2 || !letters.every(isDone)) return;
  mode = 'best';
  curLetter = '';
  liked = items;
  startDuels(items);
};

// ---------- Eşleşmeler ----------
function startDuels(list) {
  current = shuffle(list);
  nextRound = []; pos = 0; runnerUp = null;
  totalMatches = current.length - 1; doneMatches = 0;
  show('duel');
  nextMatch();
}

function nextMatch() {
  // turun sonuna gelindi mi?
  if (pos >= current.length) {
    if (nextRound.length === 1) return finish(nextRound[0]);
    current = shuffle(nextRound);
    nextRound = []; pos = 0;
  }
  // tek kalan isim bir üst tura geçer
  if (pos === current.length - 1) {
    nextRound.push(current[pos]);
    pos++;
    return nextMatch();
  }
  fill($('pickA'), current[pos]);
  fill($('pickB'), current[pos + 1]);
  updateDuelLabels();
  $('duelBar').style.width = (doneMatches / totalMatches * 100) + '%';
  saveSession();
}

function fill(btn, item) {
  setFull(btn.querySelector('.full'), item[0]);
  btn.querySelector('.meaning').textContent = item[1];
  btn._item = item;
}

function choose(btn, other) {
  const win = btn._item, lose = other._item;
  nextRound.push(win);
  if (current.length === 2) runnerUp = lose;
  pos += 2; doneMatches++;
  nextMatch();
}
$('pickA').onclick = () => choose($('pickA'), $('pickB'));
$('pickB').onclick = () => choose($('pickB'), $('pickA'));

// ---------- Sonuç ----------
function finish(win) {
  clearSession();
  if (liked.length === 1 && mode !== 'best') runnerUp = null;
  winnerName = win[0];
  babyIdx = Math.floor(Math.random() * I18N.tr.babyMsgs.length);

  // kaydet
  if (mode === 'letter' && !replay) {
    progress.letters[curLetter] = win[0];
  } else if (mode === 'letter' || mode === 'all') {
    // tüm isimler oyunu ve tekrar oynanan harf: ekstra olarak En İyiler'e girer
    const already = mode === 'letter' && progress.letters[curLetter] === win[0];
    if (!already && !progress.extras.includes(win[0])) progress.extras.push(win[0]);
  } else if (mode === 'best') {
    progress.best = win[0];
  }
  saveProgress();

  setFull($('winner'), win[0], true);
  $('winMeaning').textContent = win[1];
  const list = $('likedList');
  list.innerHTML = '';
  liked.forEach(([n]) => chip(list, n + ' ' + SURNAME));
  list.classList.remove('show');
  show('result');
  updateResultLabels();
  confetti();
}

$('showLiked').onclick = () => {
  $('likedList').classList.toggle('show');
  updateResultLabels();
};
$('again').onclick = goStart;

function confetti() {
  const panel = $('resultPanel');
  panel.querySelectorAll('.confetti').forEach(n => n.remove());
  const emojis = ['💙', '⭐', '🎈', '✨', '🧸', '🎉'];
  for (let i = 0; i < 36; i++) {
    const s = document.createElement('span');
    s.className = 'confetti';
    s.textContent = emojis[i % emojis.length];
    s.style.left = Math.random() * 100 + '%';
    s.style.animationDuration = (2.2 + Math.random() * 2.2) + 's';
    s.style.animationDelay = (Math.random() * 0.8) + 's';
    panel.appendChild(s);
  }
}

applyLang();
</script>
</body>
</html>
